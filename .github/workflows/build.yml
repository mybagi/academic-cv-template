name: Package official CV PDFs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: academic-cv
          path: |
            pdf/mingyu-bian-cv-en.pdf
            pdf/mingyu-bian-cv-zh.pdf
          if-no-files-found: error
